name: Build Director Zone APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate shaders
        run: sudo apt-get install -y glslang-tools >/dev/null && python3 tools/check_shaders.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK" || { echo "::error::no APK"; exit 1; }
          cp "$APK" Director-Zone.apk
          ls -la Director-Zone.apk
      - uses: actions/upload-artifact@v4
        with: { name: Director-Zone-apk, path: Director-Zone.apk, retention-days: 30 }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view latest >/dev/null 2>&1; then gh release upload latest Director-Zone.apk --clobber
          else gh release create latest Director-Zone.apk --title "Director Zone — latest build" --notes "Install Director-Zone.apk on your Android phone (allow installs from this source)." --latest; fi

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Director-Zone-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: "*.png\nlogcat.txt\nresult.txt" }

  playback-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate test clips (A red / B green / C blue, 5s each) and a 15s tone
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          mkdir -p ci_assets/dztest
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          mk() { ffmpeg -y -loglevel error -f lavfi -i "color=c=$2:s=480x270:r=30:d=5" -vf "drawtext=fontfile=$FONT:text='$1  %{pts\\:hms}':fontsize=40:fontcolor=white:x=20:y=20,geq=lum='if(gt(Y,H*0.88)*lt(X,W*T/5),255,lum(X,Y))':cb='if(gt(Y,H*0.88)*lt(X,W*T/5),128,cb(X,Y))':cr='if(gt(Y,H*0.88)*lt(X,W*T/5),128,cr(X,Y))'" -c:v libx264 -pix_fmt yuv420p -g 15 -an ci_assets/dztest/$1.mp4; }
          mk A 0xD02020; mk B 0x20B030; mk C 0x2050E0
          ffmpeg -y -loglevel error -f lavfi -i "sine=frequency=440:duration=15" -c:a aac -b:a 96k ci_assets/dztest/tone.m4a
          echo "${PREVIEW_SIDE:-540}" > ci_assets/dztest/side.txt
          ls -la ci_assets/dztest
      - name: Build test APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease -PdzTest=true && cp $(find app/build/outputs/apk/release -name '*.apk' | head -1) Director-Zone-test.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/playback_test.sh
      - name: Publish results to branch ci-results
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p /tmp/pub && cp -r results/* /tmp/pub/ 2>/dev/null || true; echo ${{ github.sha }} > /tmp/pub/sha.txt
          cd /tmp/pub && git init -q && git checkout -q -b ci-results && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -q -m "playback test results ${{ github.sha }}" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" ci-results
