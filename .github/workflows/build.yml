name: Build Director Zone APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate shaders
        run: sudo apt-get install -y glslang-tools >/dev/null && python3 tools/check_shaders.py
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -f "$APK" || { echo "::error::no APK"; exit 1; }
          cp "$APK" Director-Zone.apk
          ls -la Director-Zone.apk
      - uses: actions/upload-artifact@v4
        with: { name: Director-Zone-apk, path: Director-Zone.apk, retention-days: 30 }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view latest >/dev/null 2>&1; then gh release upload latest Director-Zone.apk --clobber
          else gh release create latest Director-Zone.apk --title "Director Zone — latest build" --notes "Install Director-Zone.apk on your Android phone (allow installs from this source)." --latest; fi

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: Director-Zone-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: "*.png\nlogcat.txt\nresult.txt" }
